<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo 1</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
    <a-scene keyboard-shortcuts="" screenshot="" xr-mode-ui="" device-orientation-permission-ui="">
     <a-box position="-1 1.6 -5" animation="property: position; to: 1 8 -10; dur: 2000; easing: linear; loop: true" color="tomato"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E" material="color: #06686a"></a-sphere>
      <a-cylinder position="0.96721 0.75 -3.01034" radius="0.5" height="1.5" color="#FFC65D" material="color: #880c1e"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4" material="color: #399cf9"></a-plane>
      <a-sky color="#ECECEC"></a-sky>

    <a-assets>
    <img id="texture" src="grass.jpg">
    </a-assets>

    <!-- Textured box. -->
    <a-cone src="#texture"></a-cone>

     <a-assets>
    <img id="sky" src="space.jpg">
    </a-assets>
    <a-sky src="#sky"></a-sky>

    </a-scene>

</body>
</html>
