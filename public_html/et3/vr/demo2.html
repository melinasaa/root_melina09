<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 2</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>
  <a-scene>
    <a-plane cursor-listener position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
    <a-sky color="#ECECEC"></a-sky>
    <a-gltf-model cursor-listener id="object" src="images/Flower.glb" gltf-model="./img/Flower.glb" scale="0.2 0.2 0.2"
      position="0 0 -3.78525"></a-gltf-model>

    <a-entity camera look-controls wasd-controls position="0 2 1">
      <a-entity cursor="fuse: true; fuseTimeout: 500" position="0 0 -1"
        geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03" material="color: black; shader: flat">
      </a-entity>
    </a-entity>
  </a-scene>

  <script>

    let lookedAtOnce = false;
    let mySound1 = new Audio('./sounds/spongebob-fail.mp3');

    AFRAME.registerComponent('cursor-listener', {
      init: function () {
        var lastIndex = -1;
        var COLORS = ['red', 'green', 'blue'];
        this.el.addEventListener('click', function (evt) {
          lastIndex = (lastIndex + 1) % COLORS.length;
          this.setAttribute('material', 'color', COLORS[lastIndex]);
          console.log('I was clicked at: ', evt.detail.intersection.point);

          if (this.getAttribute("id") == "object") {
            if (!lookedAtOnce) {
              alert("Horray!"); lookedAtOnce = true;
              mySound1.play();
            } else {
              this.setAttribute("animation", "dur: 300; property: position; to: 1 2 4;");
            }
          }

        });

      }
    });
  </script>
</body>

</html>
